services:
  fastapi:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cucumber_miniproject_fastapi
    ports:
      - "8080:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - ./server/data:/app/data
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: miniproject_tunnel
    command: tunnel --no-autoupdate --url http://fastapi:8000
    restart: unless-stopped
    depends_on:
      - fastapi
